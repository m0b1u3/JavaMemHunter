name: Test
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./mvnw -B -ntp -DskipITs verify

  integration:
    runs-on: ubuntu-latest
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        profile: [sb27, sb32]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./mvnw -B -ntp -DskipITs install
      - run: ./mvnw -B -ntp -pl integration-tests -P${{ matrix.profile }} verify
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.profile }}
          path: integration-tests/target/evidence/
