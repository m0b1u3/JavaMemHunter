name: Bug report
description: Report a reproducible bug
labels: [bug]
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "JDK 17 / Spring Boot 2.7.18 / Tomcat 9.0.83 / Linux"
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Actual behavior }
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes:
      label: Evidence files
      description: "Attach scan-report.json / clean-plan.json / clean-result.json if applicable."
