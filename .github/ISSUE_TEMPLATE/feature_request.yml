name: Feature request
description: Suggest a new capability
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes: { label: Scenario / use case }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposal }
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives considered }
